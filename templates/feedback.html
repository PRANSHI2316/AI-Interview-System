<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Feedback - AI Interview Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/feedback.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="page-landing">
    <div id="feedbackOverlay" class="feedback-overlay"></div>
    <script src="{{ url_for('static', filename='js/feedback-dashboard.js') }}"></script>
    <script>
        async function loadSummary() {
            const params = new URLSearchParams(window.location.search);
            const sessionId = params.get("session_id");
            const overlay = document.getElementById("feedbackOverlay");
            if (!sessionId) {
                overlay.innerHTML = "<div class='feedback-generating'><p>No session found.</p></div>";
                return;
            }

            FeedbackDashboard.showGenerating(overlay);
            const res = await fetch(`/api/interview/${encodeURIComponent(sessionId)}/summary`);
            const data = await res.json();
            if (!data.success) {
                overlay.innerHTML = "<div class='feedback-generating'><p>Report not found.</p></div>";
                return;
            }
            data.summary.session_id = sessionId;
            FeedbackDashboard.render(overlay, data.summary);
        }
        loadSummary();
    </script>
</body>
</html>
