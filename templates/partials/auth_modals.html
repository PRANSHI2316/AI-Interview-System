<div class="modal-backdrop" id="login-modal" aria-hidden="true">
    <div class="modal-card glass" role="dialog" aria-labelledby="login-title">
        <button type="button" class="modal-close" data-close-modal aria-label="Close">&times;</button>
        <h2 id="login-title" class="modal-title">Login</h2>
        <p class="modal-subtitle">Sign in to start your AI interview practice</p>
        <form id="login-form" class="auth-form">
            <label class="auth-label" for="login-email">Email</label>
            <input class="auth-input" type="email" id="login-email" name="email" required autocomplete="email" placeholder="you@example.com" />
            <label class="auth-label" for="login-password">Password</label>
            <input class="auth-input" type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="••••••••" />
            <p class="auth-error" id="login-error"></p>
            <button type="submit" class="btn-start-interview btn-start-interview--enabled w-full">Login</button>
        </form>
        <p class="modal-footer-text">No account? <a href="#" id="link-to-signup">Sign up</a></p>
    </div>
</div>

<div class="modal-backdrop" id="signup-modal" aria-hidden="true">
    <div class="modal-card glass" role="dialog" aria-labelledby="signup-title">
        <button type="button" class="modal-close" data-close-modal aria-label="Close">&times;</button>
        <h2 id="signup-title" class="modal-title">Sign Up</h2>
        <p class="modal-subtitle">Create an account to save your interview progress</p>
        <form id="signup-form" class="auth-form">
            <label class="auth-label" for="signup-username">Username</label>
            <input class="auth-input" type="text" id="signup-username" name="username" required autocomplete="username" placeholder="yourname" />
            <label class="auth-label" for="signup-email">Email</label>
            <input class="auth-input" type="email" id="signup-email" name="email" required autocomplete="email" placeholder="you@example.com" />
            <label class="auth-label" for="signup-password">Password</label>
            <input class="auth-input" type="password" id="signup-password" name="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters" />
            <p class="auth-error" id="signup-error"></p>
            <button type="submit" class="btn-start-interview btn-start-interview--enabled w-full">Create Account</button>
        </form>
        <p class="modal-footer-text">Already have an account? <a href="#" id="link-to-login">Login</a></p>
    </div>
</div>
